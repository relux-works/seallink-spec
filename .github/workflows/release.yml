name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate, Bundle & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python3 -m pip install --quiet "jsonschema>=4.23"

      - name: Run specification consistency, schema, and vector linter
        run: python3 tools/speclint.py --require-jsonschema

      - name: Run multi-operator verifier mutation audits (refusal-return, wrong-code, boundary)
        run: |
          python3 tools/mutation_audit.py --mode refusal-return --min-kill-pct 100
          python3 tools/mutation_audit.py --mode wrong-code --min-kill-pct 100
          python3 tools/mutation_audit.py --mode boundary --min-kill-pct 95

      - name: Build single-file Markdown and standalone HTML/Print-PDF release bundles
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/build_bundle.py \
            --version "${TAG}" \
            --out "dist/seallink-spec-${TAG}.md" \
            --sha256-out "dist/seallink-spec-${TAG}.md.sha256"
          python3 tools/build_site.py --version "${TAG}" --out site
          cp "site/releases/${TAG}/seallink-spec-${TAG}.html" "dist/seallink-spec-${TAG}.html"
          cp "site/releases/${TAG}/seallink-spec-${TAG}.html.sha256" "dist/seallink-spec-${TAG}.html.sha256"
          ls -lh dist/
          cat "dist/seallink-spec-${TAG}.md.sha256"
          cat "dist/seallink-spec-${TAG}.html.sha256"

      - name: Determine prerelease flag
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "${TAG}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          SHA_MD=$(awk '{print $1}' "dist/seallink-spec-${TAG}.md.sha256")
          SHA_HTML=$(awk '{print $1}' "dist/seallink-spec-${TAG}.html.sha256")
          FLAGS=(--title "SealLink Specification ${TAG}")
          if [[ "${PRERELEASE}" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${TAG}" \
            "dist/seallink-spec-${TAG}.md" \
            "dist/seallink-spec-${TAG}.md.sha256" \
            "dist/seallink-spec-${TAG}.html" \
            "dist/seallink-spec-${TAG}.html.sha256" \
            "${FLAGS[@]}" \
            --notes "$(cat <<EOF
          ## SealLink Protocol Specification \`${TAG}\`

          Compiled single-file Markdown and standalone Print-to-PDF HTML editions (also published live with canonical \`\$id\` JSON Schemas at [seallink.org](https://seallink.org/)):
          - Normative Core Specifications (\`SPEC-00\` through \`SPEC-07\`)
          - Standard Profiles (\`PROFILE-mail-v1\`, \`PROFILE-agent-v1\`)
          - Conformance Requirements, Open Questions, and SLIP Template
          - Machine-Readable Registries (\`registry/*.json\`)
          - Formal Draft 2020-12 Wire JSON Schemas (\`schemas/*.schema.json\`) — live at \`https://seallink.org/releases/${TAG}/schemas/\`
          - Informative Guides (\`GUIDE-01\`), Complete 113-Rule Inventory (mechanically checked against \`registry/refusal-codes.json\`), and Conformance Vector Manifest (9 executable suites, 200 crypto/logic checks, 372 live verifier checks, 1628 Draft 2020-12 schema checks, schema-validated 84/84 refusal-code matrix, cold-observer RPC adapter \`tools/nc_rpc_adapter.py\` with observation brackets, \`pre_effect_recheck\`, schema-driven \`*_vout\` traversal, and operational/regtest clock modes, and multi-operator verifier mutation audits via \`tools/mutation_audit.py\`: \`216/216\` = 100.0% \`refusal-return\`, \`216/216\` = 100.0% \`wrong-code\` [0 exceptions], and \`66/69\` = 95.7% exact numeric \`boundary\` [0 exceptions])
          - Two-node Namecoin Core \`nc28.0\` regtest proofs: standalone \`P2A\` package relay (\`conformance/p2a-regtest/\`) and live 5-trace cold-observer end-to-end suite (\`conformance/traces-regtest/\`, 29 live \`Tier1Verifier\` verdicts with \`require_observation_bracket=True\`, covering flagship \`mail/read\` + \`executor_ref\` + named recipient + \`pre_effect_recheck\` + mempool revoke, \`P2WSH\` 2-of-3 \`namepsbt\` + non-default \`pending_vout = 2\` CSV + \`0x10\`, depth-2 sibling \`row_ordinal\` + restart recovery + \`single_use_1_of_2\` + TRUC v3 \`P2A\` CPFP, \`agent/guardian-message\` + separate-process quota-free restart recovery, and historical eternal diploma across live 30-block expiry, lawful re-registration, and live mid-read tip-change bracket \`CHAIN_OBSERVATION_VOID\` -> retry \`ADMIT\`)

          **SHA-256 (\`seallink-spec-${TAG}.md\`):** \`${SHA_MD}\`  
          **SHA-256 (\`seallink-spec-${TAG}.html\`):** \`${SHA_HTML}\`
          EOF
          )"
