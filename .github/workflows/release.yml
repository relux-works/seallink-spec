name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  deployments: write

jobs:
  lint:
    name: Spec Lint & Executable Verifier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python3 -m pip install --quiet "jsonschema>=4.23"

      - name: Run specification consistency, schema, and vector linter
        run: python3 tools/speclint.py --require-jsonschema

  mutation_audit:
    name: Mutation Audit (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        mode: [refusal-return, wrong-code, boundary]
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python3 -m pip install --quiet "jsonschema>=4.23"

      - name: Run ${{ matrix.mode }} verifier mutation audit (100% kill bar)
        run: python3 tools/mutation_audit.py --mode "${{ matrix.mode }}" --min-kill-pct 100

  publish:
    name: Bundle & Publish Release
    needs: [lint, mutation_audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build single-file Markdown and standalone HTML/Print-PDF release bundles
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/build_bundle.py \
            --version "${TAG}" \
            --out "dist/seallink-spec-${TAG}.md" \
            --sha256-out "dist/seallink-spec-${TAG}.md.sha256"
          python3 tools/build_site.py --version "${TAG}" --archive-tags none --out site
          cp "site/releases/${TAG}/seallink-spec-${TAG}.html" "dist/seallink-spec-${TAG}.html"
          cp "site/releases/${TAG}/seallink-spec-${TAG}.html.sha256" "dist/seallink-spec-${TAG}.html.sha256"
          ls -lh dist/
          cat "dist/seallink-spec-${TAG}.md.sha256"
          cat "dist/seallink-spec-${TAG}.html.sha256"

      - name: Determine prerelease flag
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "${TAG}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          SHA_MD=$(awk '{print $1}' "dist/seallink-spec-${TAG}.md.sha256")
          SHA_HTML=$(awk '{print $1}' "dist/seallink-spec-${TAG}.html.sha256")
          FLAGS=(--title "SealLink Specification ${TAG}")
          if [[ "${PRERELEASE}" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${TAG}" \
            "dist/seallink-spec-${TAG}.md" \
            "dist/seallink-spec-${TAG}.md.sha256" \
            "dist/seallink-spec-${TAG}.html" \
            "dist/seallink-spec-${TAG}.html.sha256" \
            "${FLAGS[@]}" \
            --notes "$(cat <<EOF
          ## SealLink Protocol Specification \`${TAG}\`

          Compiled single-file Markdown and standalone Print-to-PDF HTML editions (also published live with canonical \`\$id\` JSON Schemas at [seallink.org](https://seallink.org/); for byte-exact SHA-256 verification of the standalone HTML bundle, verify the GitHub Release asset below, as CDN edge proxies may inject telemetry/optimization tags on HTML responses):
          - Normative Core Specifications (\`SPEC-00\` through \`SPEC-07\`)
          - Standard Profiles (\`PROFILE-mail-v1\`, \`PROFILE-agent-v1\`, \`PROFILE-artifact-v1\`)
          - Conformance Requirements, Open Questions, and SLIP Template
          - Machine-Readable Registries (\`registry/*.json\`)
          - Formal Draft 2020-12 Wire JSON Schemas (\`schemas/*.schema.json\`) — live at \`https://seallink.org/releases/${TAG}/schemas/\`
          - Informative Guides (\`GUIDE-01\`), Complete 123-Rule Inventory (mechanically checked against \`registry/refusal-codes.json\`), and Conformance Vector Manifest (9 deterministic suites, 10 registries including \`registry/actions.json\`, \`registry/artifact-schemes.json\`, \`registry/locator-schemes.json\`, \`registry/crypto-algorithms.json\`, \`registry/service-types.json\` with \`"sso"\`, and \`SLNK\` forward-compatibility criticality ranges \`0x15\`–\`0x1a\` \`critical_forward_only\` / \`0x1b\`–\`0x1f\` \`critical_retroactive\` / \`0x20\`–\`0x2f\` \`advisory_ignorable\` + reserved \`SLSC\` prefix, 14 portable-RE2-gated Draft 2020-12 schemas, 286 standalone crypto/logic checks, 1328 live verifier checks across 1212 module-tagged \`security-conformance.json\` cases and 89/89 module-tagged \`refusal-coverage-matrix.json\` cases with \`core\` cases enforced under \`enabled_modules=["core"]\`, 6518 Draft 2020-12 schema checks, 40/40 object types including constant-width 256-leaf salted-Merkle \`sets.auth\` & \`sets.devices\`, hardened cold-observer RPC adapter \`tools/nc_rpc_adapter.py\` with 9-method read-only \`rpcwhitelist\` support, closed \`ChainViewSnapshot\` emission, per-lineage \`first_error_height\`, quiet maturity BIP-113 \`mediantime\`, \`0x13\`/\`0x14\` \`next_log_vout\`/\`handover_next_vout\` traversal, observation brackets, closed-bracket \`pre_effect_recheck\`, file-locked transactional state merge, and operational/regtest clock modes, and parallel multi-operator verifier mutation audits via \`tools/mutation_audit.py\`: \`533/533\` = 100.0% \`refusal-return\`, \`533/533\` = 100.0% \`wrong-code\` [0 exceptions], and \`249/249\` = 100.0% exact numeric \`boundary\` — \`1315/1315\` total, \`0\` survivors)
          - Two-node Namecoin Core \`nc28.0\` regtest proofs: standalone \`P2A\` package relay (\`conformance/p2a-regtest/\`) and live 7-trace cold-observer end-to-end suite (\`conformance/traces-regtest/\`, 52 live \`Tier1Verifier\` verdicts with \`require_observation_bracket=True\`, closed \`ChainViewSnapshot\` schema validation, and dedicated 9-method read-only \`rpcwhitelist\` Node B verified to reject \`sendrawtransaction\` with HTTP 403, covering flagship \`mail/read\` + \`executor_ref\` + named recipient + foreign-issuer \`GRANT_TARGET_UNAUTHORIZED\` + two-phase late-receipt commit + closed-bracket \`pre_effect_recheck\` + mempool revoke, native \`P2WSH\` 2-of-3 \`BranchKeySpec\` \`disposer_pk\` + \`P2WSH\` 2-of-3 \`namepsbt\` + live-registered recovery candidate \`id/t2-child-leo-recovered\` + non-default \`pending_vout = 2\` CSV + \`0x01\`-anchored historical ward contract survival across \`0x0f\` & live guardian \`link.grant\` rotation + unanchored historical ward refusal + \`0x10\` + Decision \`1B\` confirmed \`capacity/1\` & \`P2WSH\` 2-of-3 handover -> State 4 autonomous adult assent, depth-2 sibling \`row_ordinal\` + \`(seal_txid, seal_vout + 1)\` linkage + witness-verified restart recovery + self-contained Phase-1 -> restart -> Phase-2 \`single_use_1_of_2\` unified \`settlement\` + TRUC v3 \`P2A\` CPFP, \`agent/guardian-message\` + two-phase late-receipt separate-process restart recovery, historical eternal diploma across live 30-block expiry + lawful re-registration + live mid-read tip-change bracket + live transfer-written \`NAME_WRITER_UNVERIFIED\` + live \`invalidateblock\` reorg exclusion, \`0x13 VOLUNTARY_REBIND\` \`T_offer\` -> \`T_rebind\` + \`D=144\` quiet maturity MTP + Step 3 activation + alien legacy \`P2PKH\` hijack isolation, and \`0x14 LOG_CHECKPOINT\` with \`genesis_seal_outpoint\` + canonical \`next_log_vout = 1\` + Linux \`fsverity-sha256\` \`seallink-release/1\` + \`FencedJournal\` \`log-head\` replay + \`PROFILE-artifact-v1\` Gatekeeper + SMT revocation + fresh stateless stale-head rejection + live \`K1->K2\`/\`P1->P2\` post-rotation \`target_state_inclusion\` & no-false-fraud + 4-step chained real mined \`nc28.0\` \`SegWitNameUpdateProof\` anchored to \`TrustedHeaderCheckpoint\` (\`recent_11_times\` MTP(11)) + 2-page \`next_header_checkpoint\` pagination & 11 contiguous real \`CAuxPow\` headers + live Tier 2 SPV fixture export)

          **SHA-256 (\`seallink-spec-${TAG}.md\`):** \`${SHA_MD}\`  
          **SHA-256 (\`seallink-spec-${TAG}.html\`):** \`${SHA_HTML}\`
          EOF
          )"

  deploy_site:
    name: Deploy seallink.org (Post-Gate)
    needs: [publish]
    uses: ./.github/workflows/deploy-site.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
