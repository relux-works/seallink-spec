name: Deploy seallink.org

# Immutable release publishing policy: production seallink.org deploys ONLY via
# workflow_call from Release (strictly AFTER lint + 100% mutation_audit + publish)
# or explicit workflow_dispatch so commits on main and unverified tags never mutate
# already-published immutable /releases/<tag>/ endpoints.
on:
  workflow_call:
    inputs:
      version:
        description: "Immutable release tag to publish (e.g. v1.0.0-draft.12)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release tag label (defaults to latest v* tag)"
        required: false
        default: ""

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy seallink.org to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage site publisher script from workflow ref
        run: cp tools/build_site.py "${RUNNER_TEMP}/build_site.py"

      - name: Resolve and verify immutable release tag
        id: ver
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
          fi
          if [[ -z "${TAG}" || "${TAG}" != v* ]]; then
            echo "ERROR: deploy-site requires an existing release tag starting with 'v' (got '${TAG}')." >&2
            exit 1
          fi
          TAG_COMMIT=$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" || true)
          if [[ -z "${TAG_COMMIT}" ]]; then
            echo "ERROR: release tag 'refs/tags/${TAG}' does not exist in git history; refusing to deploy untagged commit." >&2
            exit 1
          fi
          git checkout --detach "${TAG_COMMIT}"
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [[ "${HEAD_COMMIT}" != "${TAG_COMMIT}" ]]; then
            echo "ERROR: HEAD (${HEAD_COMMIT}) does not match refs/tags/${TAG}^{commit} (${TAG_COMMIT})." >&2
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python3 -m pip install --quiet "jsonschema>=4.23"

      - name: Validate tagged specification before deploy
        run: python3 tools/speclint.py --require-jsonschema

      - name: Build static site, archived releases & live schema endpoints
        run: python3 "${RUNNER_TEMP}/build_site.py" --root . --version "${{ steps.ver.outputs.version }}" --archive-tags auto --out site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=seallink-org --branch=main
